<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>삼성카드 가계부</title>
<style>
  :root{
    --bg:#0b0e14; --card:#151a24; --line:#232a38;
    --text:#e8ecf3; --sub:#8b94a7;
    --green:#3dff7c; --red:#ff4d5e; --gold:#ffd479; --blue:#57b6ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    padding:20px 16px 48px;max-width:560px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
  #syncBtn{background:var(--card);border:1px solid var(--line);color:var(--text);
    font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer}
  #syncBtn:active{transform:scale(.97)}
  #syncBtn:disabled{opacity:.5}
  .status{font-size:12px;color:var(--sub);margin-bottom:16px;min-height:16px}
  .status.err{color:var(--red)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px;margin-bottom:14px}
  .hero-label{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:6px}
  .hero-amount{font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .hero-sub{font-size:13px;color:var(--sub);margin-top:8px}
  .hero-sub b{color:var(--text)}
  .budget-row{display:flex;justify-content:space-between;font-size:12.5px;
    color:var(--sub);font-weight:600;margin-top:16px}
  .budget-row b{color:var(--text)}
  .bar{height:10px;background:#0d1017;border-radius:99px;overflow:hidden;margin-top:7px}
  .bar-fill{height:100%;background:var(--green);border-radius:99px;transition:width .4s ease}
  .bar-fill.over{background:var(--red)}
  .budget-remain{font-size:12.5px;color:var(--sub);margin-top:7px}
  .budget-remain.over{color:var(--red);font-weight:700}
  .sec-title{font-size:14px;font-weight:800;margin-bottom:14px}
  .cat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
  .cat-row:last-child{margin-bottom:0}
  .cat-name{width:76px;flex:none;color:var(--text);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat-bar{flex:1;height:8px;background:#0d1017;border-radius:99px;overflow:hidden}
  .cat-fill{height:100%;background:var(--gold);border-radius:99px}
  .cat-amt{width:92px;flex:none;text-align:right;font-weight:700}
  .tx{display:flex;justify-content:space-between;align-items:center;
    padding:11px 0;border-bottom:1px solid var(--line)}
  .tx:last-child{border-bottom:none}
  .tx-left{min-width:0}
  .tx-merchant{font-size:14px;font-weight:700;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tx-meta{font-size:11.5px;color:var(--sub);margin-top:2px}
  .tx-right{text-align:right;flex:none;margin-left:12px}
  .tx-amt{font-size:14.5px;font-weight:800}
  .tx-amt.cancel{color:var(--red)}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;
    border-radius:99px;margin-left:6px;vertical-align:1px}
  .badge.ok{background:rgba(87,182,255,.15);color:var(--blue)}
  .badge.no{background:rgba(255,77,94,.15);color:var(--red)}
  .badge.etc{background:rgba(139,148,167,.15);color:var(--sub)}
  #moreBtn{width:100%;background:none;border:1px solid var(--line);color:var(--sub);
    font-size:13px;font-weight:700;padding:11px;border-radius:12px;cursor:pointer;margin-top:6px}
  .empty{font-size:13px;color:var(--sub);text-align:center;padding:14px 0}
  footer{font-size:11px;color:var(--sub);text-align:center;margin-top:20px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>💳 삼성카드 가계부</h1>
  <button id="syncBtn" type="button">⟳ 동기화</button>
</header>
<div class="status" id="status">불러오는 중…</div>

<section class="card">
  <div class="hero-label" id="heroLabel">이번 달 총지출</div>
  <div class="hero-amount" id="heroAmount">- 원</div>
  <div class="hero-sub" id="heroSub"></div>
  <div class="budget-row"><span id="budgetLabel"></span><span id="budgetPct"></span></div>
  <div class="bar"><div class="bar-fill" id="budgetFill" style="width:0%"></div></div>
  <div class="budget-remain" id="budgetRemain"></div>
</section>

<section class="card">
  <div class="sec-title">분류별 합계 (이번 달)</div>
  <div id="catList"><div class="empty">내역이 없어요</div></div>
</section>

<section class="card">
  <div class="sec-title">최근 이용 내역</div>
  <div id="txList"><div class="empty">불러오는 중…</div></div>
  <button id="moreBtn" type="button" style="display:none">더 보기</button>
</section>

<footer>데이터는 구글 시트에서 바로 읽어와요.<br>새로고침하면 최신 내역으로 다시 불러옵니다.</footer>

<script>
/* ============================================================
   설정 — 여기 두 값만 바꾸면 됩니다.
   APPS_SCRIPT_URL : Apps Script 웹앱 배포 주소 (…/exec)
   ACCESS_KEY      : Apps Script 코드의 SECRET 값과 동일하게
   ============================================================ */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxK-3uZEv9hMB76sBQcz3XH8e-PDjbbZnIFNzPgONUxhEAFq1PHvb-EugxnSJMRkFFI/exec";
const ACCESS_KEY = "0630";
const MONTHLY_BUDGET = 700000;                    // 월 예산(원) — 매월 동일
const BUDGET_OVERRIDES = { "2026-10": 300000 };   // 특정 달만 다르면 여기에 (2026-10은 30만원)
/* ============================================================ */

const PAGE = 10;
let allRows = [];     // 정규화된 전체 행 (최신순)
let showAll = false;

const $ = id => document.getElementById(id);
const won = n => n.toLocaleString("ko-KR") + "원";

/* 시간 파싱: ISO 문자열(2026-10-20T08:28:44.000Z) 또는 "2026. 10. 20 오후 5:28:44" */
function parseTime(s) {
  s = String(s || "");
  if (/^\d{4}-\d{2}-\d{2}T/.test(s)) {
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }
  const m = s.match(/(\d{4})\.\s*(\d{1,2})\.\s*(\d{1,2})\s*(오전|오후)\s*(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  if (!m) return null;
  let h = parseInt(m[5], 10);
  if (m[4] === "오후" && h < 12) h += 12;
  if (m[4] === "오전" && h === 12) h = 0;
  return new Date(+m[1], +m[2] - 1, +m[3], h, +m[6], +(m[7] || 0));
}

/* 가맹점 칸이 비어 있으면 문자 원문에서 추출 ("10/20 17:28 쿠팡") */
function merchantFromRaw(raw) {
  const lines = String(raw || "").split("\n");
  for (const ln of lines) {
    const m = ln.trim().match(/^\d{2}\/\d{2}\s+\d{2}:\d{2}\s+(.+)$/);
    if (m) return m[1].trim();
  }
  return "";
}

function normalize(r) {
  const raw = r["원문"] || "";
  const merchantCol = (r["가맹점"] || "").trim();
  const merchant = merchantCol || merchantFromRaw(raw) || "(가맹점 없음)";
  const amount = parseInt(String(r["금액"] ?? "").replace(/[^0-9]/g, ""), 10) || 0;
  const status = (r["상태"] || "").trim();       // 승인 / 취소 / 기타
  const dt = parseTime(r["시간"]);
  const isTest = /test|테스트/i.test(raw) || /test|테스트/i.test(merchant);
  return {
    dt, amount, status, merchant,
    method: (r["결제방식"] || "").trim(),
    category: (r["분류"] || "").trim() || "미분류",
    isTest
  };
}

async function syncData() {
  const btn = $("syncBtn");
  btn.disabled = true;
  $("status").textContent = "불러오는 중…";
  $("status").className = "status";
  try {
    const url = APPS_SCRIPT_URL + "?key=" + encodeURIComponent(ACCESS_KEY) + "&mode=list";
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || "forbidden");
    allRows = (data.rows || []).map(normalize)
      .filter(r => r.dt && !r.isTest)
      .sort((a, b) => b.dt - a.dt);
    render();
    const now = new Date();
    $("status").textContent = "마지막 동기화 " +
      String(now.getHours()).padStart(2, "0") + ":" +
      String(now.getMinutes()).padStart(2, "0") + ":" +
      String(now.getSeconds()).padStart(2, "0");
  } catch (e) {
    $("status").textContent = "불러오기 실패 — 잠시 후 동기화를 다시 눌러주세요";
    $("status").className = "status err";
  }
  btn.disabled = false;
}

function render() {
  const now = new Date();
  const ym = now.getFullYear() * 100 + (now.getMonth() + 1);
  const thisMonth = allRows.filter(r => r.dt.getFullYear() * 100 + (r.dt.getMonth() + 1) === ym);

  /* 이번 달 합계: 승인 +, 취소 −, 기타 제외 */
  let total = 0, okCnt = 0, cancelCnt = 0, cancelAmt = 0;
  const cats = {};
  for (const r of thisMonth) {
    if (r.status === "승인") { total += r.amount; okCnt++; cats[r.category] = (cats[r.category] || 0) + r.amount; }
    else if (r.status === "취소") { total -= r.amount; cancelCnt++; cancelAmt += r.amount; cats[r.category] = (cats[r.category] || 0) - r.amount; }
  }
  $("heroLabel").textContent = (now.getMonth() + 1) + "월 총지출";
  $("heroAmount").textContent = won(total);
  $("heroSub").innerHTML = "승인 <b>" + okCnt + "건</b>" +
    (cancelCnt ? " · 취소 <b>" + cancelCnt + "건</b> (−" + won(cancelAmt) + ")" : "");

  /* 예산 막대 */
  const bKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const budget = BUDGET_OVERRIDES[bKey] ?? MONTHLY_BUDGET;
  const pct = budget > 0 ? (total / budget * 100) : 0;
  const over = total > budget;
  $("budgetLabel").innerHTML = "월 예산 <b>" + won(budget) + "</b>";
  $("budgetPct").textContent = pct.toFixed(1) + "% 사용";
  $("budgetFill").style.width = Math.min(100, pct) + "%";
  $("budgetFill").className = "bar-fill" + (over ? " over" : "");
  $("budgetRemain").textContent = over
    ? "예산보다 " + won(total - budget) + " 초과했어요"
    : "남은 금액 " + won(budget - total);
  $("budgetRemain").className = "budget-remain" + (over ? " over" : "");

  /* 분류별 */
  const catArr = Object.entries(cats).sort((a, b) => b[1] - a[1]);
  const maxCat = catArr.length ? Math.max(...catArr.map(c => Math.abs(c[1]))) : 0;
  $("catList").innerHTML = catArr.length ? catArr.map(([name, amt]) =>
    '<div class="cat-row"><div class="cat-name">' + esc(name) + '</div>' +
    '<div class="cat-bar"><div class="cat-fill" style="width:' +
      (maxCat ? Math.max(4, Math.abs(amt) / maxCat * 100) : 0) + '%"></div></div>' +
    '<div class="cat-amt">' + won(amt) + '</div></div>').join("")
    : '<div class="empty">이번 달 내역이 없어요</div>';

  /* 최근 내역 */
  const show = showAll ? allRows : allRows.slice(0, PAGE);
  $("txList").innerHTML = show.length ? show.map(r => {
    const d = r.dt;
    const dateStr = (d.getMonth() + 1) + "/" + d.getDate() + " " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    const badge = r.status === "승인" ? '<span class="badge ok">승인</span>'
      : r.status === "취소" ? '<span class="badge no">취소</span>'
      : '<span class="badge etc">' + esc(r.status || "기타") + '</span>';
    const sign = r.status === "취소" ? "−" : "";
    return '<div class="tx"><div class="tx-left">' +
      '<div class="tx-merchant">' + esc(r.merchant) + badge + '</div>' +
      '<div class="tx-meta">' + dateStr + (r.method ? " · " + esc(r.method) : "") +
      (r.category !== "미분류" ? " · " + esc(r.category) : "") + '</div></div>' +
      '<div class="tx-right"><div class="tx-amt' + (r.status === "취소" ? " cancel" : "") + '">' +
      sign + won(r.amount) + '</div></div></div>';
  }).join("") : '<div class="empty">내역이 없어요</div>';
  $("moreBtn").style.display = (!showAll && allRows.length > PAGE) ? "block" : "none";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

$("syncBtn").addEventListener("click", syncData);
$("moreBtn").addEventListener("click", () => { showAll = true; render(); });
syncData();
</script>
</body>
</html>
